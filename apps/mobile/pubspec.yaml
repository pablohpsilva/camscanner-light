name: mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.1+18

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned (was `any`, P15): a silent bump could shift date/number formatting.
  # Caret keeps it within flutter_localizations' compatible 0.20.x range.
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image: ^4.5.0
  archive: ^4.2.0
  shared_preferences: ^2.3.2
  # Pinned EXACTLY (do not caret/upgrade) — see the note above the `hooks:`
  # section at the bottom of this file for why this version and not a caret.
  opencv_dart: 2.2.2
  # The NATIVE OpenCV. Pinned exactly and declared directly because
  # opencv_dart only asks for `^2.2.2`, so without this line the compiled
  # OpenCV source can move on its own under the pinned wrapper. See the long
  # note above the `hooks:` section for the verification this version carries.
  dartcv4: 2.3.0
  drift: ^2.35.0
  # NOTE: no `sqlite3_flutter_libs` here, deliberately. `package:sqlite3` 3.x
  # bundles SQLite itself through Dart build hooks (see NativeAssetsManifest.json
  # — `package:sqlite3/src/ffi/libsqlite3.g.dart` -> sqlite3.framework/sqlite3 on
  # iOS, lib/<abi>/libsqlite3.so on Android), which is what the upstream v3
  # upgrade notes mean by "if you depend on sqlite3_flutter_libs, stop doing
  # that". The old plugin's platform build scripts are redundant, and its 0.6.0
  # release is an EMPTY marker package, not an upgrade — do not "bump" to it.
  path_provider: ^2.1.4
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.0
  pdfx: ^2.9.0
  cunning_document_scanner: ^3.0.2
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  share_plus: ^13.2.0
  syncfusion_flutter_pdf: ^34.2.7
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  http: ^1.2.2
  package_info_plus: ^10.2.0
  device_info_plus: ^13.0.0
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.3.0
  flutter_slidable: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  bdd_widget_test: ^2.1.4
  build_runner: ^2.15.0
  drift_dev: ^2.35.0
  exif: ^3.3.0
  sqlite3: ^3.0.0
  # Used by the donation Ko-fi launch-mode test to mock UrlLauncherPlatform.
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  # Used by the locale-store test to mock SharedPreferencesStorePlatform
  # (simulates a store read failure without a raw method-channel mock).
  shared_preferences_platform_interface: ^2.4.1
  # Used by the withIsolateTimeout tests to drive timeout timers deterministically
  # (no real wall-clock waits). Transitive via flutter_test; declared explicitly
  # so the direct import satisfies depend_on_referenced_packages.
  fake_async: ^1.3.3

# opencv_dart 2.x native-assets module config: the app only uses core + imgproc
# + imgcodecs (perspective warp, filters, contours, decode/encode). Excluding the
# heavy modules keeps the native binary small and the build fast.
#
# WHY opencv_dart IS PINNED EXACTLY (no caret): from 2.2.x, dartcv4 COMPILES
# OpenCV FROM SOURCE via CMake/Ninja instead of downloading a prebuilt binary.
# A cold build therefore costs ~5m20s instead of ~30s (measured on 2.2.2,
# Android, this machine); incremental builds reuse the CMake cache and are
# normal speed. A caret range would let that cost — and any upstream source
# change — arrive silently, so the version is chosen deliberately and verified
# on both devices before it moves.
#
# TRAP: after changing this version you MUST delete
# apps/mobile/.dart_tool/hooks_runner/ before building. The CMake cache records
# the OLD dartcv source path and the build dies with "does not match the source
# ... used to generate cache". That failure looks like an incompatibility and
# is not one.
#
# 2.2.2 verified 2026-09-09: native-vs-Dart Auto parity is byte-identical to
# 2.1.0 (mean=1.193 max=13 full-frame, 0.090/9 bright-bg on the same Android
# device, gate is mean < 2.0), and the whole OpenCV device surface is green —
# 25/25 on a physical Android, and np1/np2/np3/e4/e5 on a physical iPhone.
#
# THE PIN ABOVE DOES NOT COVER THE NATIVE CODE BY ITSELF. opencv_dart is a thin
# Dart wrapper; the OpenCV that actually gets COMPILED comes from `dartcv4`,
# which opencv_dart 2.2.2 declares only as `dartcv4: ^2.2.2`. So a plain
# `flutter pub upgrade` moves the native source under a pinned opencv_dart —
# exactly the silent change the exact pin was meant to prevent. dartcv4 is
# therefore pinned explicitly in `dependencies:` above; keep the two in step.
#
# dartcv4 2.3.0 verified 2026-09-10 (both devices, with the native-assets
# overrides below): parity UNCHANGED — mean=1.193 max=13 and 0.090/9 on Android,
# mean=1.188 max=12 and 0.090/9 on the iPhone — across np1/np2/np3, e1/e2/e4/e5,
# g1/g3/g4, f1/f3/f4 and k3. Its `treeshake` hook option (new in 2.3.0) restricts
# exported native symbols and writes its keep-list ONLY on AOT builds, so a bad
# keep-list would break RELEASE while every Debug integration test still passed.
# It defaults to false and we do not enable it below — leave it that way unless
# you are prepared to verify a Release build by hand.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  generate: true

  assets:
    - assets/icons/
    # Loaded at runtime (rootBundle) for the searchable PDF text layer so
    # dart_pdf can encode non-Latin-1 OCR characters — see loadOcrPdfFont.
    - fonts/IBMPlexMono-Regular.ttf

  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree[wght].ttf
    - family: IBMPlexMono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Every package below sits at the newest version published. Each entry is here
# because some upstream constraint pinned it BELOW that, and each was verified
# on a real Android device AND a real iPhone before being kept — an override
# silences the constraint solver, so it is only honest with evidence behind it.
#
# What each one costs to be wrong: pub can no longer tell us when the override
# becomes genuinely incompatible. Re-check this block whenever Flutter or the
# native-assets packages move (`flutter pub outdated`, then re-run the OpenCV
# parity + DB device batches).
dependency_overrides:
  # pdf 3.13.0 (its own latest) caps `archive <4.1.0`. 4.1.0/4.2.0 are pure
  # fixes/optimisations — no breaking changes — and pdf touches archive only in
  # lib/src/pdf/io/js.dart (web I/O, which we never build). We DO use archive
  # directly for the ZIP export (file_archiver.dart), so 4.1.0's "RangeError
  # parsing ZIP extra fields" and "invalid path separator in zip content
  # compression" fixes are ours to gain. Verified by r4/multi_export/j1/q1.
  archive: 4.2.0

  # The Flutter SDK pins these two EXACTLY (flutter_test -> test_api 0.7.12,
  # flutter -> material_color_utilities 0.13.0), so they normally only move when
  # Flutter moves. NOTE both are patch bumps that NOTHING in lib/ imports — they
  # are framework internals — so the benefit here is close to zero while the
  # risk (framework running against a version it was not compiled with) is real.
  # These are the first two to drop if this block ever misbehaves.
  material_color_utilities: 0.13.1
  test_api: 0.7.14

  # Build-time only (build_runner / drift_dev / dart_style). drift_dev 2.35.0
  # caps `cli_util <0.6.0`; codegen verified green with 0.6.0 anyway
  # (`dart run build_runner build --delete-conflicting-outputs`, 1294 outputs).
  package_config: 3.0.0
  cli_util: 0.6.0

  # The native-assets toolchain. native_toolchain_c 0.19.4 and objective_c 9.6.0
  # both require `code_assets ^2.0.0`, while dartcv4 2.3.0 still declares
  # `code_assets ^1.0.0` and sqlite3 3.5.2 `<3.0.0` — so this trio moves as a
  # cluster that dartcv4 gates. dartcv4's cap proved CONSERVATIVE rather than a
  # real incompatibility: with these overrides OpenCV rebuilt from source
  # against the 2.x hook API and produced BYTE-IDENTICAL output (np2 parity
  # mean=1.193 max=13 and 0.090/9 on Android — the same figures as the 2.2.2
  # baseline recorded above; mean=1.188 max=12 on the iPhone, gate is mean<2.0).
  # This is the highest-risk group in the block: it governs how the OpenCV and
  # SQLite native libraries are BUILT, so re-run np1/np2/np3 + the DB batch on
  # both devices before trusting any change here.
  code_assets: 2.0.0
  native_toolchain_c: 0.19.4
  objective_c: 9.6.0

# NOT overridden, deliberately — `qr: 4.0.0` is available and does NOT work:
# it is a hard API break (QrErrorCorrectLevel class -> enum, QrCode made
# immutable, addData/fromUint8List/fromData removed) and BOTH dependents are
# already at their own latest and still require qr 3.x — barcode 2.2.9 (pulled
# in by pdf) needs `^3.0.0`, qr_flutter 4.1.0 needs `^3.0.1`. Forcing it broke
# barcode's compile and took out 107 tests. Making it work would mean forking
# and maintaining two third-party packages, one of them inside the PDF path.
# Revisit when barcode/qr_flutter publish qr 4.x support.
